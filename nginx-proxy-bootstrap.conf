# Temporary HTTP-only config used before certs exist (see README's
# "Get SSL certificates (first time only)" step). nginx needs to be up to
# serve the ACME HTTP-01 challenge, but it can't load nginx-proxy.conf yet
# (that config points at cert files certbot hasn't issued). Swap this out
# for nginx-proxy.conf once certonly succeeds.
server {
    listen 80;
    server_name arthdeskapi.ashokitservices.com arthdesk.ashokitservices.com arthdeskadmin.ashokitservices.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
